[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frbop"
version = "0.1.0"
description = "Unified FRB optimisation command-line toolkit"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Joel Balzan" }]
dependencies = []

[project.optional-dependencies]
dm = ["numpy>=1.20", "scipy>=1.7", "matplotlib>=3.4", "numba>=0.58"]
rm = ["numpy>=1.20", "scipy>=1.7", "matplotlib>=3.3", "RM-Tools>=1.4.2", "basemap==1.4.1", "rmnest", "setuptools<=80.0.0"]
sc = ["numpy>=1.20", "scipy>=1.7", "matplotlib>=3.4", "pyyaml>=6.0"]
sn = ["numpy>=1.20", "matplotlib>=3.4"]
all = [
  "frbop[dm,rm,sc,sn]"
]

[project.scripts]
frbop = "frbop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
